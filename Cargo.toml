[package]
name = "meshbench"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "System-level mesh shader memory performance simulator for clustered geometry"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
gltf = "1.4"
meshopt = { git = "https://github.com/impakt73/meshopt-rs", rev = "75a23e82e96475b12cd6adb1bbbe35c67c1454b9" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
